[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # No real backend yet: serve the API from MSW static mocks (see .env.example)
  VITE_API_MOCKING = "enabled"

# SPA fallback: serve index.html for every route so a refresh on /shops etc.
# doesn't 404. Real files (assets, mockServiceWorker.js) are still served as-is,
# and the client router sends unknown paths to /requests.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
